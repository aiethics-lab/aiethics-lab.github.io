<!DOCTYPE html>
<html>
<body>
<script type="module">
  try {
    const module = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3/dist/transformers.min.js');
    console.log("Loaded successfully", module);
    document.body.innerHTML = "Success! Loaded transformers.js";
  } catch (err) {
    console.error("Failed to load", err);
    document.body.innerHTML = "Error: " + err.message;
  }
</script>
</body>
</html>
