<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>LLM Ethical Sandbox | AI Ethics Toolkit</title>
    <meta name="description"
        content="Experiment with LiquidAI's LFM2.5 WebGPU model to explore system prompt adherence, bias, and prompt injection entirely in your browser." />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>    <script>
        // ==================== THEME & SIDEBAR ====================
        const themeToggle = document.getElementById('themeToggle');
        function setTheme(dark) { document.documentElement.classList.toggle('dark', dark); document.documentElement.classList.toggle('light', !dark); localStorage.setItem('ethicsToolkitTheme', dark ? 'dark' : 'light'); }
        const savedTheme = localStorage.getItem('ethicsToolkitTheme');
        if (savedTheme === 'light') { setTheme(false); themeToggle.checked = false; }
        themeToggle.addEventListener('change', () => setTheme(themeToggle.checked));

        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobileOverlay');
        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) { sidebar.classList.remove('-translate-x-full'); mobileOverlay.classList.remove('hidden'); setTimeout(() => mobileOverlay.classList.remove('opacity-0'), 10); }
            else { sidebar.classList.add('-translate-x-full'); mobileOverlay.classList.add('opacity-0'); setTimeout(() => mobileOverlay.classList.add('hidden'), 300); }
        }
        document.getElementById('openSidebar')?.addEventListener('click', toggleSidebar);
        document.getElementById('closeSidebar')?.addEventListener('click', toggleSidebar);
        mobileOverlay?.addEventListener('click', toggleSidebar);

        // ==================== WEB WORKER IMPLEMENTATION ====================

        // UI Elements
        const loadBtn = document.getElementById('loadBtn');
        const modelStatus = document.getElementById('modelStatus');
        const modelProgress = document.getElementById('modelProgress');
        const modelReady = document.getElementById('modelReady');
        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');
        const tpsCounter = document.getElementById('tpsCounter');
        const webgpuWarning = document.getElementById('webgpuWarning');

        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const chatMessages = document.getElementById('chatMessages');
        const systemPromptEl = document.getElementById('systemPrompt');
        const tempValue = document.getElementById('tempValue');
        const tempSlider = document.getElementById('temperature');

        // ==================== THINK STREAM PARSER ====================
        // Ported from LiquidAI's official HF space (think-parser.ts).
        // The LFM2.5-Thinking model wraps reasoning in <think>...</think> tags.
        const THINK_OPEN = '<think>';
        const THINK_CLOSE = '</think>';

        function safeFlushLen(buf, tag) {
            for (let n = Math.min(buf.length, tag.length - 1); n > 0; n--) {
                if (buf.endsWith(tag.slice(0, n))) return buf.length - n;
            }
            return buf.length;
        }

        function createParser() {
            return { reasoning: '', content: '', inThink: false, buf: '' };
        }

        function pushToParser(p, text) {
            const deltas = [];
            p.buf += text;
            while (p.buf.length > 0) {
                if (p.inThink) {
                    const ci = p.buf.indexOf(THINK_CLOSE);
                    if (ci !== -1) {
                        const before = p.buf.slice(0, ci);
                        if (before) { p.reasoning += before; deltas.push({ type: 'reasoning', t: before }); }
                        p.buf = p.buf.slice(ci + THINK_CLOSE.length);
                        p.inThink = false;
                        continue;
                    }
                    const sl = safeFlushLen(p.buf, THINK_CLOSE);
                    if (sl > 0) { const c = p.buf.slice(0, sl); p.reasoning += c; deltas.push({ type: 'reasoning', t: c }); p.buf = p.buf.slice(sl); }
                    break;
                } else {
                    const oi = p.buf.indexOf(THINK_OPEN);
                    if (oi !== -1) {
                        const before = p.buf.slice(0, oi);
                        if (before) { p.content += before; deltas.push({ type: 'content', t: before }); }
                        p.buf = p.buf.slice(oi + THINK_OPEN.length);
                        p.inThink = true;
                        continue;
                    }
                    const sl = safeFlushLen(p.buf, THINK_OPEN);
                    if (sl > 0) { const c = p.buf.slice(0, sl); p.content += c; deltas.push({ type: 'content', t: c }); p.buf = p.buf.slice(sl); }
                    break;
                }
            }
            return deltas;
        }

        function flushParser(p) {
            if (!p.buf) return;
            if (p.inThink) p.reasoning += p.buf;
            else p.content += p.buf;
            p.buf = '';
        }

        // State
        let worker = null;
        let isModelReady = false;
        let isGenerating = false;
        let messages = [];
        let currentParser = null;

        // Check WebGPU Support
        if (!navigator.gpu) {
            webgpuWarning.classList.remove('hidden');
            loadBtn.disabled = true;
            loadBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        // Initialize Web Worker
        function initWorker() {
            worker = new Worker('llm-worker.js', { type: 'module' });

            worker.onmessage = function(e) {
                const { type, ...data } = e.data;

                if (type === 'status') {
                    if (data.status === 'loading') {
                        modelStatus.classList.add('hidden');
                        modelProgress.classList.remove('hidden');
                    } else if (data.status === 'ready') {
                        modelProgress.classList.add('hidden');
                        modelReady.classList.remove('hidden');
                        modelReady.classList.add('flex');
                        isModelReady = true;
                        updateInputs();
                    } else if (data.status === 'error') {
                        alert("Error loading model: " + data.message);
                        modelStatus.classList.remove('hidden');
                        modelProgress.classList.add('hidden');
                        loadBtn.disabled = false;
                    }
                } else if (type === 'progress') {
                    if (data.progress) {
                        progressBar.style.width = data.progress + '%';
                        document.getElementById('progressPercent').textContent = Math.round(data.progress) + '%';
                    }
                    progressText.textContent = data.file ? 'Downloading ' + data.file.substring(data.file.lastIndexOf('/') + 1) : 'Loading...';
                } else if (type === 'chunk') {
                    handleChunk(data.chunk, data.tps);
                } else if (type === 'complete') {
                    if (currentParser) flushParser(currentParser);
                    isGenerating = false;
                    updateInputs();
                } else if (type === 'error') {
                    alert('Generation error: ' + data.message);
                    isGenerating = false;
                    updateInputs();
                }
            };
        }

        loadBtn.addEventListener('click', () => {
            if (!worker) initWorker();
            loadBtn.disabled = true;
            worker.postMessage({ type: 'load' });
        });

        tempSlider.addEventListener('input', (e) => {
            tempValue.textContent = e.target.value;
        });

        function updateInputs() {
            const hasText = userInput.value.trim().length > 0;
            const canSend = isModelReady && !isGenerating && hasText;
            sendBtn.disabled = !canSend;
            userInput.disabled = isGenerating;
            if (isGenerating) {
                sendBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
            } else {
                sendBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                tpsCounter.textContent = 'Ready for inference';
                if (isModelReady) setTimeout(() => userInput.focus(), 10);
            }
        }

        userInput.addEventListener('input', updateInputs);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) sendBtn.click();
            }
        });

        function appendMessage(role, content) {
            const id = 'msg-' + Date.now();
            let html = '';
            if (role === 'user') {
                html = `<div class="flex gap-4 justify-end"><div class="max-w-[85%] bg-primary/10 text-slate-800 dark:text-slate-200 border border-primary/20 p-3 rounded-2xl rounded-tr-sm"><div class="prose prose-sm dark:prose-invert max-w-none break-words whitespace-pre-wrap">${content}</div></div></div>`;
            } else {
                html = `
                <div class="flex gap-4" id="${id}">
                    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center flex-shrink-0 mt-1 shadow-md shadow-primary/20">
                        <span class="material-icons-outlined text-white text-sm">psychology</span>
                    </div>
                    <div class="flex-1 space-y-3 min-w-0">
                        <div class="thought-container hidden border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-surface-dark-lighter rounded-xl overflow-hidden text-sm">
                            <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-700 font-medium text-slate-500 flex items-center text-xs uppercase tracking-wide bg-slate-100/50 dark:bg-slate-800">
                                <span class="material-icons-outlined text-[14px] mr-1">lightbulb</span> Thought Process
                            </div>
                            <div class="thought-content p-3 text-slate-600 dark:text-slate-400 italic max-h-[300px] overflow-y-auto whitespace-pre-wrap font-[sans-serif]"></div>
                        </div>
                        <div class="response-content prose prose-sm dark:prose-invert max-w-none text-slate-800 dark:text-slate-200 markdown-body">
                            <span class="inline-flex space-x-1.5 items-center justify-center translate-y-2 opacity-70">
                                <span class="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500 animate-bounce" style="animation-delay: -0.3s"></span>
                                <span class="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500 animate-bounce" style="animation-delay: -0.15s"></span>
                                <span class="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500 animate-bounce"></span>
                            </span>
                        </div>
                    </div>
                </div>`;
            }
            chatMessages.insertAdjacentHTML('beforeend', html);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return role === 'assistant' ? document.getElementById(id) : null;
        }

        function handleChunk(chunk, tps) {
            if (!currentParser) return;
            tpsCounter.textContent = tps + ' tokens/s';

            const deltas = pushToParser(currentParser, chunk);
            const msgEl = document.getElementById('msg-assistant');
            if (!msgEl) return;

            const thoughtContainer = msgEl.querySelector('.thought-container');
            const thoughtContent = msgEl.querySelector('.thought-content');
            const responseContent = msgEl.querySelector('.response-content');

            for (const d of deltas) {
                if (d.type === 'reasoning') {
                    thoughtContainer.classList.remove('hidden');
                    thoughtContent.textContent = currentParser.reasoning;
                } else if (d.type === 'content') {
                    responseContent.innerHTML = marked.parse(currentParser.content);
                }
            }

            if (currentParser.inThink && !currentParser.content) {
                responseContent.innerHTML = '<span class="text-slate-400 italic text-sm">Thinking...</span>';
            }

            const atBottom = chatMessages.scrollHeight - chatMessages.clientHeight <= chatMessages.scrollTop + 50;
            if (atBottom) chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (!text || !isModelReady || isGenerating) return;

            const sysPrompt = systemPromptEl.value.trim();
            let turnMsgs = sysPrompt ? [{ role: 'system', content: sysPrompt }] : [];
            turnMsgs = turnMsgs.concat(messages);

            const userMsg = { role: 'user', content: text };
            messages.push(userMsg);
            turnMsgs.push(userMsg);

            appendMessage('user', text);
            userInput.value = '';

            const assistantEl = appendMessage('assistant', '');
            assistantEl.id = 'msg-assistant';

            isGenerating = true;
            currentParser = createParser();
            updateInputs();
            tpsCounter.textContent = 'Generating...';

            worker.postMessage({
                type: 'generate',
                data: { messages: turnMsgs, temperature: parseFloat(tempSlider.value), max_new_tokens: 4096 }
            });
        });

        stopBtn.addEventListener('click', () => {
            if (worker && isGenerating) { worker.postMessage({ type: 'stop' }); tpsCounter.textContent = 'Stopped'; }
        });

        clearBtn.addEventListener('click', () => {
            if (isGenerating) return;
            messages = [];
            const welcomeMsg = chatMessages.firstElementChild;
            chatMessages.innerHTML = '';
            chatMessages.appendChild(welcomeMsg);
        });

    </script>
</body>

</html>
